# 轻营 · API 网关配置
server:
  port: 88
  shutdown: graceful          # 优雅停机：等待在途请求处理完成

spring:
  application:
    name: lingmart-gateway
  # 网关默认仅缓冲 256KB 请求体，图片上传（multipart）会直接失败；调大到 20MB
  codec:
    max-in-memory-size: 20MB
  # Redis：JWT 退出登录黑名单校验（Reactive，WebFlux 栈），与 auth 服务共用实例
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  cloud:
    nacos:
      # 配置中心引导（共享配置见 Nacos DataId: lingmart-common.yaml）
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
      # 注册中心（本地引导：保证配置中心不可用时服务仍能注册，不依赖共享配置）
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        fail-fast: false          # 注册失败不阻断启动（后台重试）
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        # 强制注册 IP：规避 Windows 虚拟网卡（169.254.x.x）被误识别导致服务间访问抖动；
        # 本地默认 127.0.0.1；Docker 部署经 NACOS_DISCOVERY_IP 覆盖为宿主机局域网 IP
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
    # Sentinel 限流：网关路由级流量控制（规则见 GatewaySentinelConfig，阈值可用环境变量覆盖）
    sentinel:
      filter:
        enabled: ${SENTINEL_ENABLED:true}
      scg:
        enabled: ${SENTINEL_ENABLED:true}   # Spring Cloud Gateway 适配器开关（与 filter.enabled 同源）
      eager: true                 # 启动即初始化
      transport:
        port: 8723                # Sentinel 客户端端口（各服务需唯一，避免本机冲突）
    gateway:
      routes:
        # 各服务 OpenAPI 文档路由：/api/{svc}/v3/api-docs 去掉 /api/{svc} 前缀转发到下游 /v3/api-docs
        # （order 最小优先，避免被下方通配主路由吞掉）
        - id: auth-docs
          order: -10
          uri: lb://lingmart-auth
          predicates:
            - Path=/api/auth/v3/api-docs
          filters:
            - StripPrefix=2
        - id: shop-docs
          order: -10
          uri: lb://lingmart-shop
          predicates:
            - Path=/api/shop/v3/api-docs
          filters:
            - StripPrefix=2
        - id: product-docs
          order: -10
          uri: lb://lingmart-product
          predicates:
            - Path=/api/product/v3/api-docs
          filters:
            - StripPrefix=2
        - id: ware-docs
          order: -10
          uri: lb://lingmart-ware
          predicates:
            - Path=/api/ware/v3/api-docs
          filters:
            - StripPrefix=2
        - id: order-docs
          order: -10
          uri: lb://lingmart-order
          predicates:
            - Path=/api/order/v3/api-docs
          filters:
            - StripPrefix=2
        - id: search-docs
          order: -10
          uri: lb://lingmart-search
          predicates:
            - Path=/api/search/v3/api-docs
          filters:
            - StripPrefix=2
        - id: chat-docs
          order: -10
          uri: lb://lingmart-chat
          predicates:
            - Path=/api/chat/v3/api-docs
          filters:
            - StripPrefix=2
        - id: agent-docs
          order: -10
          uri: lb://lingmart-agent
          predicates:
            - Path=/api/agent/v3/api-docs
          filters:
            - StripPrefix=2
        # 管理端路由：/api/admin/shop/** → shop 服务、/api/admin/product/** → product 服务、
        # /api/admin/auth/** → auth 服务（角色修正等）（不剥前缀，控制器直接映射；
        # 角色拦截在 AuthGlobalFilter 完成，仅 ROLE_ADMIN）
        - id: admin-auth-route
          uri: lb://lingmart-auth
          predicates:
            - Path=/api/admin/auth/**
        - id: admin-shop-route
          uri: lb://lingmart-shop
          predicates:
            - Path=/api/admin/shop/**
        - id: admin-product-route
          uri: lb://lingmart-product
          predicates:
            - Path=/api/admin/product/**
        # 上传图片静态资源路由：/uploads/** 转发到 lingmart-shop（不剥前缀，由 shop 静态资源处理器直接提供文件）
        - id: uploads-route
          uri: lb://lingmart-shop
          predicates:
            - Path=/uploads/**
        # 认证中心路由：/api/auth/** 转发到 lingmart-auth 服务（Nacos 负载均衡）
        - id: auth-route
          uri: lb://lingmart-auth
          predicates:
            - Path=/api/auth/**
        # 店铺服务路由：/api/shop/**
        - id: shop-route
          uri: lb://lingmart-shop
          predicates:
            - Path=/api/shop/**
        # 商品服务路由：/api/product/**
        - id: product-route
          uri: lb://lingmart-product
          predicates:
            - Path=/api/product/**
        # 订单服务路由：/api/order/** 与购物车 /api/cart/**
        - id: order-route
          uri: lb://lingmart-order
          predicates:
            - Path=/api/order/**,/api/cart/**
        # 仓储服务路由：/api/ware/**
        - id: ware-route
          uri: lb://lingmart-ware
          predicates:
            - Path=/api/ware/**
        # 检索服务路由：/api/search/**
        - id: search-route
          uri: lb://lingmart-search
          predicates:
            - Path=/api/search/**
        # 聊天服务路由：REST /api/chat/** + WebSocket 握手 /ws/**
        - id: chat-route
          uri: lb://lingmart-chat
          predicates:
            - Path=/api/chat/**
        - id: chat-ws-route
          uri: lb://lingmart-chat
          predicates:
            - Path=/ws/**
        # 网页浮窗 Agent 服务路由：/api/agent/**（SSE 对话 + 会话管理 + 知识库管理）
        - id: agent-route
          uri: lb://lingmart-agent
          predicates:
            - Path=/api/agent/**

  config:
    # 加载 Nacos 共享配置（可选：Nacos 不可用时仍启动，但注册/管理端配置缺失）
    import: "optional:nacos:lingmart-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true"

# OpenAPI 聚合：通过网关把各服务文档合并，供统一 Swagger UI / Apifox 一键导入
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}      # 生产设 SPRINGDOC_ENABLED=false 关闭
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    urls:
      - name: lingmart-auth
        url: /api/auth/v3/api-docs
      - name: lingmart-shop
        url: /api/shop/v3/api-docs
      - name: lingmart-product
        url: /api/product/v3/api-docs
      - name: lingmart-ware
        url: /api/ware/v3/api-docs
      - name: lingmart-order
        url: /api/order/v3/api-docs
      - name: lingmart-search
        url: /api/search/v3/api-docs
      - name: lingmart-chat
        url: /api/chat/v3/api-docs
      - name: lingmart-agent
        url: /api/agent/v3/api-docs
  gateway-config:
    enabled: true
    aggregate-routes: true

# 轻营自定义配置
lingmart:
  jwt:
    # 与 lingmart-auth 保持一致（生产用 JWT_SECRET 环境变量统一覆盖）
    secret: ${JWT_SECRET:lingmart-secret-key-for-jwt-2026-please-change-in-production-env}
  gateway:
    # OpenAPI 聚合对外暴露的网关地址（服务地址统一指向此 Base URL，Apifox 导入后可直接调用）
    public-addr: ${GATEWAY_PUBLIC_ADDR:http://localhost:88}
    # 白名单（无需登录即可访问的路径，逗号分隔，Ant 风格）：
    # 注册 / 登录 / 验证码为公开接口；/v3/api-docs 与 /api/{svc}/v3/api-docs 为 OpenAPI 文档放行；
    # /uploads/** 为上传图片静态资源；/api/shop/storefront/** 店铺主页、/api/shop/list 店铺列表（首页以店铺为入口）；
    # /api/shop/*/fulfillment 店铺履约能力（结算页判断能否选快递、自提去哪儿取，游客也应能看到）；
    # /api/search/** 为商品检索（无需登录也能逛）；
    # /ws/** 为聊天 WebSocket 握手（HTTP 握手阶段放行；业务鉴权 token 经 STOMP CONNECT 头携带，
    # 由 lingmart-chat 的 JwtChannelInterceptor 校验，网关不校验 STOMP 帧）；/actuator/health 供健康检查
    whitelist: /api/auth/register,/api/auth/login,/api/auth/code/send,/api/auth/v3/api-docs,/api/shop/v3/api-docs,/api/product/v3/api-docs,/api/ware/v3/api-docs,/api/order/v3/api-docs,/api/search/v3/api-docs,/api/chat/v3/api-docs,/api/agent/v3/api-docs,/api/shop/storefront/**,/api/shop/list,/api/shop/*/fulfillment,/api/search/**,/uploads/**,/ws/**,/v3/api-docs,/v3/api-docs/**,/swagger-ui.html,/swagger-ui/**,/webjars/**,/actuator/health
    # 网关路由级限流阈值（QPS，Sentinel GatewayFlowRule 使用，可用环境变量覆盖）
    sentinel:
      auth-route-qps: ${SENTINEL_AUTH_QPS:200}       # 认证中心（登录/注册，含验证码限流兜底）
      shop-route-qps: ${SENTINEL_SHOP_QPS:100}
      product-route-qps: ${SENTINEL_PRODUCT_QPS:100}
      order-route-qps: ${SENTINEL_ORDER_QPS:100}     # 订单 + 购物车
      ware-route-qps: ${SENTINEL_WARE_QPS:100}
      search-route-qps: ${SENTINEL_SEARCH_QPS:50}    # 检索较贵，调低

# 管理端点与链路追踪已移至 Nacos 共享配置（lingmart-common.yaml）
