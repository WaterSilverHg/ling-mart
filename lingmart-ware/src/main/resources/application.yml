# 轻营 · 仓储服务配置
server:
  port: 11000
  shutdown: graceful          # 优雅停机：等待在途请求处理完成

spring:
  application:
    name: lingmart-ware
  threads:
    virtual:
      enabled: true
  cloud:
    nacos:
      # 配置中心引导（共享配置见 Nacos DataId: lingmart-common.yaml）
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
      # 注册中心（本地引导：保证配置中心不可用时服务仍能注册，不依赖共享配置）
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        fail-fast: false          # 注册失败不阻断启动（后台重试）
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        # 强制注册 IP：规避 Windows 虚拟网卡（169.254.x.x）被误识别导致服务间访问抖动；
        # 本地默认 127.0.0.1；Docker 部署经 NACOS_DISCOVERY_IP 覆盖为宿主机局域网 IP
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
  config:
    # 加载 Nacos 共享配置（可选：Nacos 不可用时仍启动，但注册/MyBatis/管理端配置缺失）
    import: "optional:nacos:lingmart-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/lingmart_ware?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  # RabbitMQ：订阅「订单支付成功」事件异步扣减库存（环境变量与 order 侧同一套 RABBITMQ_* 约定）
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}

# MyBatis-Plus 配置已移至 Nacos 共享配置（lingmart-common.yaml）

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}      # 生产设 SPRINGDOC_ENABLED=false 关闭
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html

# Seata 分布式事务客户端（2.5.0 AT 模式）
seata:
  enabled: true
  application-id: lingmart-ware
  # 事务分组名，需与 seata-server 的 vgroupMapping（default 集群）一致
  tx-service-group: lingmart_tx_group
  config:
    type: file
  # TC 地址发现方式：file=直连下面的 grouplist（默认，推荐） / nacos=从 Nacos 的 SEATA_GROUP 取。
  # 默认 file 是为了绕开「TC 在容器里、往 Nacos 注册了 Docker 内网 IP（172.x），宿主机服务连不上」
  # 导致的 `register RM failed: can not connect to services-server`，细节见 order 服务同段注释。
  registry:
    type: ${SEATA_REGISTRY_TYPE:file}
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      group: SEATA_GROUP          # 与 TC 的 nacos.group 一致（仅 SEATA_REGISTRY_TYPE=nacos 时生效）
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
  service:
    vgroup-mapping:
      lingmart_tx_group: default
    grouplist:
      # 本机开发 → 127.0.0.1:8091；容器编排由 docker-compose.business.yml 覆盖为 seata-server:8091
      default: ${SEATA_GROUPLIST:127.0.0.1:8091}

# 直连模式下 Seata FileRegistry 真正读取的键名（等价于上面的 seata.service.grouplist.default，原因见 order 服务同段注释）
service.default.grouplist: ${SEATA_GROUPLIST:127.0.0.1:8091}

# 管理端点与链路追踪已移至 Nacos 共享配置（lingmart-common.yaml）
