# =============================================================
# 轻营 · Nginx TLS 终止（生产加固覆盖层 docker-compose.prod.yml 的 tls profile）
#
# 证书：/etc/nginx/certs/server.crt 与 server.key
#   本地验证可用 scripts/gen-self-signed-cert.sh 生成自签证书。
#   生产请换成正式证书（或云 LB 终止 TLS，此时不需要这个容器）。
#
# 要点：
#   - WebSocket（聊天 /ws）需要 Upgrade/Connection 头；
#   - Agent 的 SSE（/api/agent/chat）必须关闭代理缓冲，否则前端会一次性收到整段；
#   - client_max_body_size 与后端上传上限对齐（shop 20MB，agent 3MB）。
# =============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    location / {
        proxy_pass http://lingmart-gateway:88;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE / 流式：不做缓冲
        proxy_buffering off;
        proxy_cache     off;
        proxy_read_timeout 3600s;
    }
}
